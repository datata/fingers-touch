<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f6f1" />
    <meta name="description" content="Mueve hasta cinco dedos y sigue cada uno por su color." />
    <title>Dedos de colores</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="play-area" id="playArea" aria-label="Área para mover los dedos">
      <p class="hint" id="hint">Toca y mueve hasta cinco dedos</p>
      <div class="touch-points" id="touchPoints" aria-hidden="true"></div>
      <span class="countdown" id="countdown" hidden>5</span>
      <div class="winner" id="winner" hidden>
        <strong id="winnerName"></strong>
        <span>Levanta los dedos y toca para jugar otra vez</span>
      </div>
      <span class="counter" id="counter">0 / 5</span>
    </main>
    <script src="app.js"></script>
  </body>
</html>
